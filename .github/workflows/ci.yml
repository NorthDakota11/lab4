name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y cmake build-essential clang
      - run: cmake -S . -B _build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_INSTALL_PREFIX=_install
      - run: cmake --build _build
      - run: cmake --build _build --target install

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B _build -DCMAKE_INSTALL_PREFIX=_install
      - run: cmake --build _build --config Release
      - run: cmake --build _build --config Release --target install
